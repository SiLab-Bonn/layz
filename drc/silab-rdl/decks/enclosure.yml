# SiLab RDL. Lengths in µm, areas in µm² (1e-6 below the rule: compared in floating point).
rules:
  - id: RDL.Via1.enc.upper
    check: min_enclosure
    layers: [Cu1, Via1]
    value: 10.0
  - id: RDL.Via1.enc.lower
    check: min_enclosure
    layers: [Cu2, Via1]
    value: 10.0
  - id: RDL.Via2.enc.upper
    check: min_enclosure
    layers: [Cu2, Via2]
    value: 10.0
  - id: RDL.Via2.enc.lower
    check: min_enclosure
    layers: [Cu3, Via2]
    value: 10.0
  - id: RDL.Via3.enc.upper
    check: min_enclosure
    layers: [Cu3, Via3]
    value: 10.0
  - id: RDL.Via3.enc.lower
    check: min_enclosure
    layers: [Cu4, Via3]
    value: 10.0
