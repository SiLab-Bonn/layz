    check: min_width
    layers: [Via1]
    value: 10.0
  - id: RDL.Via1.space
    check: min_space
    layers: [Via1]
    value: 10.0
  - id: RDL.Via2.size
    check: min_width
    layers: [Via2]
    value: 10.0
  - id: RDL.Via2.space
    check: min_space
    layers: [Via2]
    value: 10.0
  - id: RDL.Via3.size
    check: min_width
    layers: [Via3]
    value: 10.0
  - id: RDL.Via3.space
    check: min_space
    layers: [Via3]
    value: 10.0
