# SiLab RDL. Lengths in µm, areas in µm² (1e-6 below the rule: compared in floating point).
rules:
  - id: RDL.Cu1.density
    check: max_density
    layers: [Cu1]
    value: 95.0
    params:
      scope: window
      window: 1000.0
      step: 500.0
    layer_params:
      boundary: Outline
