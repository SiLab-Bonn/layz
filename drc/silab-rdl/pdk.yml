# SiLab in-house RDL (maskless lithography): gdscheck rule deck.
#
# Rules as given by the process owners:
#   - minimum feature size, wire width and metal spacing: 10 µm
#   - minimum via 10 x 10 µm, enclosed by 10 µm of metal on every side (pads >= 30 x 30 µm)
#   - no minimum density; maximum metal density 95 % in any 1 x 1 mm window (larger solid areas
#     trap bubbles in the plated metal)
# Assumed, not given: via-to-via spacing = the 10 µm metal spacing.
#
# Layers: the obelix1 4-copper RDL (stacks/silab_rdl.toml). Run with
#   gdscheck run --pdk-path drc -p silab-rdl -s main -t TOP -i design.gds -r design.lyrdb

name: SiLab RDL
version: "0.1"

suites:
  - name: main
    path: suites/main.yml
    description: Geometry, via enclosure and maximum density
  - name: geometry
    path: suites/geometry.yml
    description: Geometry and via enclosure, without density

decks:
  - name: metal
    path: decks/metal.yml
    description: Metal width, spacing, notch and area
  - name: via
    path: decks/via.yml
    description: Via size and spacing
  - name: enclosure
    path: decks/enclosure.yml
    description: Via enclosure by the metal above and below
  - name: density
    path: decks/density.yml
    description: Maximum metal density in 1 x 1 mm windows

connectivity:
  - connector: Via1
    layers: [Cu1]
  - connector: Via1
    layers: [Cu2]
  - connector: Via2
    layers: [Cu2]
  - connector: Via2
    layers: [Cu3]
  - connector: Via3
    layers: [Cu3]
  - connector: Via3
    layers: [Cu4]

layers:
  - name: Cu1          # F.Cu: chip-side pads
    gds_layer: 8
    gds_datatype: 0
  - name: Via1         # Cu1 <-> Cu2
    gds_layer: 7
    gds_datatype: 0
  - name: Cu2          # In1.Cu
    gds_layer: 6
    gds_datatype: 0
  - name: Via2         # Cu2 <-> Cu3
    gds_layer: 4
    gds_datatype: 0
  - name: Cu3          # In2.Cu
    gds_layer: 3
    gds_datatype: 0
  - name: Via3         # Cu3 <-> Cu4
    gds_layer: 2
    gds_datatype: 0
  - name: Cu4          # B.Cu: back-side pads and planes
    gds_layer: 68
    gds_datatype: 0
  - name: Outline      # die/board outline: the density reference area
    gds_layer: 70
    gds_datatype: 0
