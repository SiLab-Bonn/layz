# Uni Bonn RDL. Lengths in µm, areas in µm² (1e-6 below the rule: compared in floating point).
rules:
  - id: RDL.V1.size
    check: min_width
    layers: [V1]
    value: 10.0
  - id: RDL.V1.space
    check: min_space
    layers: [V1]
    value: 10.0
  - id: RDL.V2.size
    check: min_width
    layers: [V2]
    value: 10.0
  - id: RDL.V2.space
    check: min_space
    layers: [V2]
    value: 10.0
  - id: RDL.PadOpen.size
    check: min_width
    layers: [PadOpen]
    value: 10.0
  - id: RDL.PadOpen.space
    check: min_space
    layers: [PadOpen]
    value: 10.0
