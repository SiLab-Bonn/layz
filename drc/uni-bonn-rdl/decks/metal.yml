  - id: RDL.M2.notch
    check: min_notch
    layers: [M2]
    value: 10.0
  - id: RDL.M2.area
    check: min_area
    layers: [M2]
    value: 99.999999
  - id: RDL.M3.width
    check: min_width
    layers: [M3]
    value: 10.0
  - id: RDL.M3.space
    check: min_space
    layers: [M3]
    value: 10.0
  - id: RDL.M3.notch
    check: min_notch
    layers: [M3]
