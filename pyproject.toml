[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "layz"
version = "0.2.0"
description = "Layout tools for SiLab FR4 PCBs, RDL chips and flex PCBs: GDS -> KiCad -> HyperLynx, and 3-D capacitance and field extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "klayout>=0.30.12",
    "kicad-pycbnew==1.0.1",
    "shapely>=2.0",        # layz nets
    "klayout-pex>=0.7.0",  # layz pex: 3-D model builder for FasterCap
    "numpy",
    "matplotlib",
    "plotly",
]
# KiCad's `pcbnew` module isn't on PyPI: it comes with the KiCad package. Create the venv on the
# system Python with its packages visible before syncing:
#   uv venv --python /usr/bin/python3 --system-site-packages && uv sync

[project.scripts]
layz = "layz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest"]
