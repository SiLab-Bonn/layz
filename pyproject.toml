[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "layz"
version = "0.2.0"
description = "Layout tools for SiLab FR4 PCBs, RDL chips and flex PCBs: GDS -> KiCad -> HyperLynx, and 3-D capacitance and field extraction."
readme = "readme.md"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "klayout>=0.30.12",
    "kicad-pycbnew==1.0.1",
    "shapely>=2.0",        # layz nets
    "pyyaml",              # layz drc --benchmark
    "klayout-pex>=0.7.0",  # layz pex: 3-D model builder for FasterCap
    "numpy",
    "matplotlib",
    "plotly",
]
# KiCad's `pcbnew` module isn't on PyPI: it comes with the KiCad package. Create the venv on the
# system Python with its packages visible (install.md):
#   python3 -m venv --system-site-packages .venv && .venv/bin/pip install --editable .

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
layz = "layz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# scripts run by other interpreters: ParaView's pvpython, HyperLynx's own Python
"layz" = ["paraview/*.py", "hyperlynx/runner/*.py"]
