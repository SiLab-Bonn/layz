[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gds2kicad"
version = "0.1.0"
description = "Convert selected GDS geometry into KiCad .kicad_pcb files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "klayout==0.30.9",
    "kicad-pycbnew==1.0.1",
]

[tool.setuptools]
py-modules = []
