[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "layz"
version = "0.2.0"
description = "Layout tools for SiLab FR4 PCBs, RDL chips and flex PCBs: GDS -> KiCad -> HyperLynx, and 3-D capacitance and field extraction."
readme = "readme.md"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "klayout>=0.30.12",
    "kicad-pycbnew==1.0.1",
    "shapely>=2.0",        # layz.gds2hyp.traces, layz.hyperlynx
    "klayout-pex>=0.7.0",  # layz.pex: 3-D model builder for FasterCap
    "numpy",
    "matplotlib>=3.11",    # rc legend.linewidth (plotstyle.py); a system 3.10 would otherwise do
    "plotly",
    "pytest",              # layz doctor runs the test suite
]
# KiCad's `pcbnew` module isn't on PyPI: it comes with the KiCad package, so install.sh makes the
# venv on the system Python with its packages visible.

[project.scripts]
layz = "layz.cli:main"

# the layz/ folder is the package
[tool.setuptools.packages.find]
include = ["layz*"]

[tool.setuptools.package-data]
# scripts run by other interpreters: HyperLynx's own Python, ParaView's pvpython
layz = ["hyperlynx/runner/*.py", "field/paraview/*.py", "web/static/*", "web/kicad/colors/*.json"]


[tool.ty.environment]
python = ".layz-env"        # layz's environment (install/layz.sh), for numpy, matplotlib, ...

[tool.ruff]
line-length = 1000          # one line per statement: no wrapping
extend-exclude = ["results"]

[tool.ruff.lint]
extend-select = ["I"]       # sorted imports
ignore = ["E501", "E731"]   # line length; a lambda bound to a name

[tool.ruff.lint.isort]
known-first-party = ["layz"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
