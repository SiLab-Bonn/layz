# Uni Bonn RDL (in-house, maskless lithography), as used by the obelix1 iVTX ladder:
# aluminium redistribution layers on polyimide, built on the chip surface.
#
# Thicknesses: asiclab tech/uni-bonn-rdl (.lyd25 / .xs, "Set UniBonnRDL polyimide to 6 um"):
#   chip pad 68/0 (z -1..0) | M1 Al 1 µm | P1 PI 6 | M2 Al 6 | P2 PI 6 + P2.5 PI 6 | M3 Al 6 | P3 PI 5
# Layers, top to bottom: TopPad 8/0, M3 6/0, M2 3/0, ChipPad 68/0 (asiclab's and pdk.yml's
# names); vias 7/0 = P3 pad opening (TopPad-M3), 4/0 = V2 (M3-M2), 2/0 = V1 (M2-ChipPad).
# Where a board goes to KiCad (gds2pcb, gds2hyp), the copper becomes F.Cu, In1.Cu, In2.Cu, B.Cu
# in that order.
#
# TO CONFIRM: polyimide εr (3.3 here, a typical value; not in asiclab); 8/0 (not in asiclab's
# tech: top pad metal on the P3 openings? thickness 0.5 µm from obelix1's KiCad board);
# M1 (1/0) isn't drawn in obelix1, so V1 goes from M2 down to the chip pads and the P1 layer
# plus the M1 level make the 7 µm between them; V2 is drawn on 4/0 alone (asiclab: 4/0 AND
# 5/0). Copper layers are aluminium; capacitance doesn't depend on the metal.

name = "Uni Bonn RDL, M2 + M3 (obelix1)"
outline = "70/0"
halo_um = 200

[[layer]]
name = "TopPad"         # top pad metal, on the P3 openings
type = "copper"
material = "Aluminium"
thickness_um = 0.5      # to confirm
gds = "8/0"
pads = true
zones = false

[[layer]]
name = "P3"
type = "dielectric"
thickness_um = 5.0
er = 3.3                # polyimide, to confirm
material = "Polyimide"

[[layer]]
name = "M3"             # Al
type = "copper"
material = "Aluminium"
thickness_um = 6.0
gds = "6/0"

[[layer]]
name = "P2+P2.5"
type = "dielectric"
thickness_um = 12.0
er = 3.3
material = "Polyimide"

[[layer]]
name = "M2"             # Al
type = "copper"
material = "Aluminium"
thickness_um = 6.0
gds = "3/0"

[[layer]]
name = "P1+M1"          # P1 polyimide 6 µm + the (undrawn) M1 level 1 µm
type = "dielectric"
thickness_um = 7.0
er = 3.3
material = "Polyimide"

[[layer]]
name = "ChipPad"        # the chip's top-metal pads
type = "copper"
material = "Aluminium"
thickness_um = 1.0
gds = "68/0"
pads = true

[[via]]
gds = "7/0"             # P3 pad opening
top = "TopPad"
bottom = "M3"

[[via]]
gds = "4/0"             # V2 (P2 opening)
top = "M3"
bottom = "M2"

[[via]]
gds = "2/0"             # V1 (P1 opening, onto the chip pads)
top = "M2"
bottom = "ChipPad"
