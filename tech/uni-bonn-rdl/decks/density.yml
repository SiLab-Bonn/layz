# Uni Bonn RDL. Lengths in µm, areas in µm² (1e-6 below the rule: compared in floating point).
rules:
  - id: RDL.M1.density
    check: max_density
    layers: [M1]
    value: 95.0
    params:
      scope: window
      window: 10000.0
      step: 500.0
    layer_params:
      boundary: Outline
  - id: RDL.M2.density
    check: max_density
    layers: [M2]
    value: 95.0
    params:
      scope: window
      window: 10000.0
      step: 500.0
    layer_params:
      boundary: Outline
  - id: RDL.M3.density
    check: max_density
    layers: [M3]
    value: 95.0
    params:
      scope: window
      window: 10000.0
      step: 500.0
    layer_params:
      boundary: Outline
